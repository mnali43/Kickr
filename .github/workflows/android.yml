name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish it as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KickrClick.apk
          NOTES="Android app for the KICKR and the Zwift Click. Build ${GITHUB_RUN_NUMBER}, $(date -u '+%d %b %Y %H:%M') UTC, commit ${GITHUB_SHA::7}. On the phone, download KickrClick.apk below and open it to install."
          if gh release view app >/dev/null 2>&1; then
            gh release upload app KickrClick.apk --clobber
            gh release edit app --notes "$NOTES"
          else
            gh release create app KickrClick.apk --title "KICKR Click app" --notes "$NOTES"
          fi

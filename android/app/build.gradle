plugins {
    id 'com.android.application'
}

// GitHub numbers each build; that number becomes the app version so every new APK installs over the last.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.kickrclick.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kickrclick.app'
        minSdk 26
        targetSdk 35
        versionCode buildNumber + 1
        versionName "1.${buildNumber}"
    }

    // A fixed key, kept in the repository, so each new build can update the installed app.
    signingConfigs {
        shared {
            storeFile file('../kickrclick.keystore')
            storePassword 'kickrclick'
            keyAlias 'kickrclick'
            keyPassword 'kickrclick'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
